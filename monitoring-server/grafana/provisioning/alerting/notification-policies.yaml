# Routing: everything goes to Telegram, grouped per alert and host so one VM
# outage does not produce a flood of messages. Critical alerts repeat sooner.
apiVersion: 1
policies:
  - orgId: 1
    receiver: telegram
    group_by: ["alertname", "host"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      - receiver: telegram
        object_matchers:
          - ["severity", "=", "critical"]
        repeat_interval: 2h
