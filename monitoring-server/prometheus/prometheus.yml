global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

# Targets live in targets/*.yml (file_sd, reloaded automatically on change).
# Every target carries a "host" label (vm1, vm2, vm3) used by dashboards and alerts.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { host: vm3 }

  - job_name: node
    file_sd_configs:
      - files: ["/etc/prometheus/targets/node.yml"]

  - job_name: cadvisor
    file_sd_configs:
      - files: ["/etc/prometheus/targets/cadvisor.yml"]
    metric_relabel_configs:
      # keep only real containers (drop the cgroup hierarchy without a name)
      - source_labels: [__name__, name]
        regex: "container_.+;"
        action: drop

  - job_name: rest-server
    static_configs:
      - targets: ["rest-server:8000"]
        labels: { host: vm3 }

  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/icmp.yml"]
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/http.yml"]
    relabel_configs: *blackbox_relabel
